        function initializeApp() {
            const savedState = localStorage.getItem('arun_traders_state');
            if (savedState) {
                try {
                    const parsed = JSON.parse(savedState);
                    Object.assign(DEFAULT_STATE, parsed);
                    if (!DEFAULT_STATE.feedPayments) DEFAULT_STATE.feedPayments = [];
                } catch (e) {
                    console.error("Error loading saved state", e);
                }
            }
            renderApp();
        }

        function saveState() {
            localStorage.setItem('arun_traders_state', JSON.stringify(DEFAULT_STATE));
        }

        function setView(viewName) {
            DEFAULT_STATE.currentView = viewName;
            DEFAULT_STATE.activeCustomerProfileId = null;
            renderApp();
        }

        function handleLogin(role, customUsername = '', customFarmerId = '') {
            let name = "Admin User";
            let username = customUsername || "admin";
            let farmerId = "";

            if (role === 'admin') {
                name = "Society Admin (Arun Traders)";
                username = "admin";
            } else if (role === 'operator') {
                name = "Collection Operator (Murugan)";
                username = "operator";
            } else if (role === 'farmer') {
                farmerId = customFarmerId || "F001";
                const f = DEFAULT_STATE.farmers.find(item => item.id === farmerId);
                name = f ? f.name : "Ramesh Kumar";
                username = farmerId;
            }

            DEFAULT_STATE.currentUser = { username, role, name, farmerId };

            if (role === 'admin') DEFAULT_STATE.currentView = 'admin_dashboard';
            else if (role === 'operator') DEFAULT_STATE.currentView = 'operator_dashboard';
            else if (role === 'farmer') DEFAULT_STATE.currentView = 'farmer_dashboard';

            saveState();
            renderApp();
        }

        function handleLogout() {
            DEFAULT_STATE.currentUser = null;
            DEFAULT_STATE.currentView = 'login';
            saveState();
            renderApp();
        }

        // Core Accounting Rule (Formula: Total Due = Total Value of All Feed Purchases − Total Payments Received)
        function getCustomerBalance(farmerId) {
            const sales = DEFAULT_STATE.feedSales.filter(s => s.farmerId === farmerId);
            const payments = DEFAULT_STATE.feedPayments.filter(p => p.farmerId === farmerId);
            const totalPurchases = sales.reduce((acc, s) => acc + s.totalAmount, 0);
            const totalPaidInSales = sales.reduce((acc, s) => acc + s.paidAmount, 0);
            const totalPayments = payments.reduce((acc, p) => acc + p.amount, 0);
            const totalPaid = totalPaidInSales + totalPayments;
            const outstandingBalance = Math.max(0, totalPurchases - totalPaid);
            return { totalPurchases, totalPaid, outstandingBalance, sales, payments };
        }

            let sales = DEFAULT_STATE.feedSales;
            if (isFarmer) {
                sales = sales.filter(s => s.farmerId === currentFarmerId);
            }

            const totalFeedSales = sales.reduce((acc, s) => acc + s.totalAmount, 0);
            const totalPaid = sales.reduce((acc, s) => acc + s.paidAmount, 0) + DEFAULT_STATE.feedPayments.reduce((acc, p) => acc + p.amount, 0);
            const totalPendingDue = sales.reduce((acc, s) => acc + s.balanceDue, 0);

            const customerMap = {};
            DEFAULT_STATE.feedSales.forEach(s => {
                if (!customerMap[s.farmerId]) {
                    customerMap[s.farmerId] = { farmerId: s.farmerId, farmerName: s.farmerName, totalPurchases: 0, totalPaid: 0, balanceDue: 0 };
                }
                customerMap[s.farmerId].totalPurchases += s.totalAmount;
                customerMap[s.farmerId].totalPaid += s.paidAmount;
                customerMap[s.farmerId].balanceDue += s.balanceDue;
            });
            DEFAULT_STATE.feedPayments.forEach(p => {
                if (customerMap[p.farmerId]) {
                    customerMap[p.farmerId].totalPaid += p.amount;
                    customerMap[p.farmerId].balanceDue = Math.max(0, customerMap[p.farmerId].totalPurchases - customerMap[p.farmerId].totalPaid);

        function openFeedSaleModal() {
            switchModalView('sale');
            const modal = document.getElementById('feed-sale-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            updateFeedSaleCalc();

        function closeFeedSaleModal() {
            const modal = document.getElementById('feed-sale-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function switchModalView(view) {
            const saleView = document.getElementById('modal-view-sale');
            const custView = document.getElementById('modal-view-customer');
            if (!saleView || !custView) return;
            if (view === 'add-customer') {
                saleView.classList.add('hidden');
                custView.classList.remove('hidden');
            } else {
                custView.classList.add('hidden');
                saleView.classList.remove('hidden');
            }
        }

        function handleCustomerSelectChange(val) {
            if (val === 'ADD_NEW') {
                switchModalView('add-customer');
            } else {
                const cb = getCustomerBalance(val);
                const banner = document.getElementById('existing-balance-banner');
                if (cb.outstandingBalance > 0) {
                    document.getElementById('banner-customer-name').innerText = DEFAULT_STATE.farmers.find(f => f.id === val)?.name || 'Customer';
                    document.getElementById('banner-customer-due').innerText = '₹' + cb.outstandingBalance.toLocaleString();
                    banner.classList.remove('hidden');
                } else {
                    banner.classList.add('hidden');
                }
            }
        }

        function submitQuickCustomer(e) {
            e.preventDefault();
            const id = document.getElementById('qc-id').value.trim();
            const name = document.getElementById('qc-name').value.trim();
            const phone = document.getElementById('qc-phone').value.trim();
            const village = document.getElementById('qc-village').value.trim();
            const address = document.getElementById('qc-address').value.trim();

            if (DEFAULT_STATE.farmers.some(f => f.phone === phone)) {
                alert("Warning: A customer with this mobile number already exists!");
            }

            const newCust = {
                id,
                name,
                phone,
                village,
                address,
                animalType: "Cow",
                cows: 1,
                buffaloes: 0,
                regDate: new Date().toISOString().split('T')[0],
                bank: "SBI - ACC",
                upi: "upi@ok",
                status: "Active"
            };

            DEFAULT_STATE.farmers.push(newCust);
            saveState();

            switchModalView('sale');
            const select = document.getElementById('fs-farmer-id');
            if (select) {
                select.innerHTML = `
                    <option value="" disabled>-- Select Customer --</option>
                    <option value="ADD_NEW" class="font-bold text-emerald-700 bg-emerald-50">➕ + Add New Customer</option>
                    ${DEFAULT_STATE.farmers.map(f => `<option value="${f.id}" ${f.id === id ? 'selected' : ''}>${f.id} - ${f.name} (${f.village})</option>`).join('')}
                `;
                handleCustomerSelectChange(id);
            }
            renderApp();
        }

        function updateFeedSaleCalc() {
            const feedSelect = document.getElementById('fs-feed-id');
            const bagsInput = document.getElementById('fs-bags');
            const paidInput = document.getElementById('fs-paid');

            if (!feedSelect || !bagsInput || !paidInput) return;

            const selectedOption = feedSelect.options[feedSelect.selectedIndex];
            const price = parseFloat(selectedOption.getAttribute('data-price')) || 1450;
            const bags = parseInt(bagsInput.value) || 1;
            const total = price * bags;

            if (document.activeElement !== paidInput && paidInput.value === "0") {
                paidInput.value = 0;
            }
            const paid = parseFloat(paidInput.value) || 0;
            const balance = Math.max(0, total - paid);

            document.getElementById('fs-display-total').innerText = total.toFixed(2);
            document.getElementById('fs-display-balance').innerText = balance.toFixed(2);
        }

        function submitFeedSale(e) {
            e.preventDefault();
            const farmerId = document.getElementById('fs-farmer-id').value;
            if (!farmerId || farmerId === 'ADD_NEW') {
                alert("Please select a valid customer.");
                return;
            }
            const farmer = DEFAULT_STATE.farmers.find(f => f.id === farmerId);
            const feedSelect = document.getElementById('fs-feed-id');
            const feedName = feedSelect.options[feedSelect.selectedIndex].text.split(' (')[0];
            const unitPrice = parseFloat(feedSelect.options[feedSelect.selectedIndex].getAttribute('data-price'));
            const bags = parseInt(document.getElementById('fs-bags').value);
            const totalAmount = unitPrice * bags;
            const paidAmount = parseFloat(document.getElementById('fs-paid').value) || 0;
            const paymentMode = document.getElementById('fs-mode').value;
            const balanceDue = Math.max(0, totalAmount - paidAmount);

            const newSale = {
                id: "FS-" + (100 + DEFAULT_STATE.feedSales.length + 1),
                farmerId,
                farmerName: farmer ? farmer.name : "Unknown",
                date: new Date().toISOString().split('T')[0],
                feedName,
                bags,
                unitPrice,
                totalAmount,
                paidAmount,
                paymentMode: paidAmount === totalAmount ? `${paymentMode} (Settled)` : (paidAmount > 0 ? "Partial Payment" : "Credit / Pending"),
                balanceDue
            };

            DEFAULT_STATE.feedSales.unshift(newSale);
            saveState();
            closeFeedSaleModal();
            renderApp();
        }

        function openPayFeedModal(txId) {
            const tx = DEFAULT_STATE.feedSales.find(s => s.id === txId);
            if (!tx) return;
            document.getElementById('pay-feed-tx-id').value = txId;
            document.getElementById('pay-feed-customer-id').value = '';
            document.getElementById('pay-feed-amount').value = tx.balanceDue;
            const modal = document.getElementById('pay-feed-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function openPayFeedModalForCustomer(farmerId) {
            const cb = getCustomerBalance(farmerId);

            document.getElementById('pay-feed-customer-id').value = farmerId;

        // Rule 7, 9, 14: Strict payment validation & FIFO distribution
        function confirmClearFeedDue() {
            const txId = document.getElementById('pay-feed-tx-id').value;
            const customerId = document.getElementById('pay-feed-customer-id').value;
            const payAmount = parseFloat(document.getElementById('pay-feed-amount').value) || 0;
            const method = document.getElementById('pay-feed-method').value;

            if (payAmount <= 0) {
                alert("Please enter a valid payment amount.");
                return;
            }

            if (txId) {
                const tx = DEFAULT_STATE.feedSales.find(s => s.id === txId);
                if (tx) {
                    if (payAmount > tx.balanceDue) {
                        alert(`Payment cannot exceed remaining balance of ₹${tx.balanceDue}`);
                        return;
                    }
                    tx.paidAmount += payAmount;
                    tx.balanceDue = Math.max(0, tx.totalAmount - tx.paidAmount);
                    tx.paymentMode = tx.balanceDue === 0 ? `${method} (Settled)` : "Partial Payment";

                    DEFAULT_STATE.feedPayments.unshift({
                        id: "FP-" + (100 + DEFAULT_STATE.feedPayments.length + 1),
                        farmerId: tx.farmerId,
                        farmerName: tx.farmerName,
                        date: new Date().toISOString().split('T')[0],
                        amount: payAmount,
                        method
                    });
                }
            } else if (customerId) {
                const cb = getCustomerBalance(customerId);
                if (payAmount > cb.outstandingBalance) {
                    alert(`Payment cannot exceed total outstanding balance of ₹${cb.outstandingBalance}`);
                    return;
                }

                let remainingPayment = payAmount;
                const customerSales = DEFAULT_STATE.feedSales.filter(s => s.farmerId === customerId && s.balanceDue > 0);

                for (let tx of customerSales) {
                    if (remainingPayment <= 0) break;
                    const applyAmt = Math.min(remainingPayment, tx.balanceDue);
                    tx.paidAmount += applyAmt;
                    tx.balanceDue = Math.max(0, tx.totalAmount - tx.paidAmount);
                    tx.paymentMode = tx.balanceDue === 0 ? `${method} (Settled)` : "Partial Payment";
                    remainingPayment -= applyAmt;
                }

                const farmer = DEFAULT_STATE.farmers.find(f => f.id === customerId);
                DEFAULT_STATE.feedPayments.unshift({
                    id: "FP-" + (100 + DEFAULT_STATE.feedPayments.length + 1),
                    farmerId: customerId,
                    farmerName: farmer ? farmer.name : "Customer",
                    date: new Date().toISOString().split('T')[0],
                    amount: payAmount,
                    method
                });
            }

            saveState();
            closePayFeedModal();
            renderApp();
        }

        function filterFeedTable() {
            const q = document.getElementById('feed-search').value.toLowerCase();
            const rows = document.querySelectorAll('#feed-table-body tr');
            const mobileItems = document.querySelectorAll('.feed-mobile-item');

            rows.forEach(r => {
                r.style.display = r.innerText.toLowerCase().includes(q) ? '' : 'none';
            });
            mobileItems.forEach(m => {
                m.style.display = m.innerText.toLowerCase().includes(q) ? '' : 'none';
            });
        }

        function renderLedgerPage() { return `<div class="dairy-card p-6"><h2 class="text-xl font-bold">Financial Ledger</h2></div>`; }
        function renderPaymentsPage() { return `<div class="dairy-card p-6"><h2 class="text-xl font-bold">Payment Management</h2></div>`; }
        function renderReportsPage() { return `<div class="dairy-card p-6"><h2 class="text-xl font-bold">Professional Reports</h2></div>`; }
        function renderAnalyticsPage() { return `<div class="dairy-card p-6"><h2 class="text-xl font-bold">Advanced Analytics</h2></div>`; }
